name: Deploy Pangea Earth to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check scripts
      - run: python -m ruff check scripts
      - uses: actions/configure-pages@v5
      - name: Stage public website assets
        run: |
          mkdir -p _site/data _site/assets
          cp index.html style.css app.js motion.js favicon.svg _site/
          cp -R src _site/
          cp data/*.json data/ATTRIBUTION.md _site/data/
          cp assets/* _site/assets/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
